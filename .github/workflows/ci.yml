name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: uv sync --group dev
        env:
          UV_TORCH_BACKEND: cpu
      - name: Run tests
        run: uv run pytest -x -q -n 4
