[project]
name = "glm-seminmf"
version = "0.1.0"
description = "Negative-binomial GLM semi-NMF: signed feature loadings, non-negative sample usages, for overdispersed count matrices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max Alexander", email = "w.max.alexander@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "torch>=2.2",
]

[project.optional-dependencies]
anndata = ["anndata>=0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3"]
benchmark = [
    "scikit-learn>=1.3", "glmpca>=0.1", "statsmodels>=0.14",
    "psutil>=5.9", "matplotlib>=3.7", "h5py>=3.8", "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glm_seminmf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings carry diagnostic content here (non-convergence, degenerate factors,
# predictor range), so nothing is suppressed wholesale. Narrow any third-party
# noise to its own module rather than re-adding a blanket ignore.
filterwarnings = ["default"]
